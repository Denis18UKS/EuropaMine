name: Build EuropaMine Fabric 1.20.1 port

on:
  push:
    branches:
      - fabric-1.20.1-port-final

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Reconstruct Fabric source tree
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .fabric-work
          mkdir -p .fabric-work
          cat .fabric-port/source.b64.part* | base64 -d > /tmp/europamine-fabric-source.tar.gz
          tar -xzf /tmp/europamine-fabric-source.tar.gz -C .fabric-work
          mkdir -p .fabric-work/project/shared-resources
          if [ -d src/main/resources/assets ]; then cp -a src/main/resources/assets .fabric-work/project/shared-resources/; fi
          if [ -d src/main/resources/data ]; then cp -a src/main/resources/data .fabric-work/project/shared-resources/; fi
          if [ -f src/main/resources/pack.mcmeta ]; then cp -a src/main/resources/pack.mcmeta .fabric-work/project/shared-resources/; fi

          mkdir -p .fabric-work/project/shared-resources/assets/barotrauma/blockstates
          mkdir -p .fabric-work/project/shared-resources/assets/barotrauma/models/block
          mkdir -p .fabric-work/project/shared-resources/assets/barotrauma/models/item
          cat > .fabric-work/project/shared-resources/assets/barotrauma/blockstates/hotbar_layout_panel.json <<'EOF'
          {
            "multipart": [
              { "apply": { "model": "barotrauma:block/hotbar_layout_panel" } }
            ]
          }
          EOF
          cat > .fabric-work/project/shared-resources/assets/barotrauma/models/block/hotbar_layout_panel.json <<'EOF'
          {
            "parent": "minecraft:block/cube_all",
            "textures": {
              "all": "minecraft:block/polished_deepslate"
            }
          }
          EOF
          cat > .fabric-work/project/shared-resources/assets/barotrauma/models/item/hotbar_layout_panel.json <<'EOF'
          {
            "parent": "barotrauma:block/hotbar_layout_panel"
          }
          EOF
          cat > .fabric-work/project/shared-resources/assets/barotrauma/models/item/slot_binding_configurator.json <<'EOF'
          {
            "parent": "minecraft:item/generated",
            "textures": {
              "layer0": "minecraft:item/comparator"
            }
          }
          EOF
          cat > .fabric-work/project/shared-resources/assets/barotrauma/models/item/submarine_drawing_tool.json <<'EOF'
          {
            "parent": "minecraft:item/generated",
            "textures": { "layer0": "minecraft:item/map" }
          }
          EOF

          sed -i "s/id 'fabric-loom' version '1.3.10'/id 'fabric-loom' version '1.6.12'/" .fabric-work/project/fabric-1.20.1/build.gradle
          sed -i 's/^mod_version=.*/mod_version=0.3.0-fabric.1/' .fabric-work/project/fabric-1.20.1/gradle.properties
          sed -i 's/^loader_version=.*/loader_version=0.16.10/' .fabric-work/project/fabric-1.20.1/gradle.properties
          sed -i 's/"fabricloader": ">=0.15.11"/"fabricloader": ">=0.16.10"/' .fabric-work/project/fabric-1.20.1/src/main/resources/fabric.mod.json
          sed -i 's/net\.fabricmc\.fabric\.api\.networking\.v1\.ClientPlayNetworking/net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking/g' \
            .fabric-work/project/fabric-1.20.1/src/main/java/com/z_mods/barotrauma/fabric/BarotraumaFabricClient.java \
            .fabric-work/project/fabric-1.20.1/src/main/java/com/z_mods/barotrauma/fabric/SystemScreens.java
          grep "fabric-loom" .fabric-work/project/fabric-1.20.1/build.gradle
          grep -E '^(mod_version|loader_version)=' .fabric-work/project/fabric-1.20.1/gradle.properties
          grep 'fabricloader' .fabric-work/project/fabric-1.20.1/src/main/resources/fabric.mod.json
          test "$(find .fabric-work/project/shared-resources/assets/barotrauma -type f | wc -l)" -eq 109
          test "$(find .fabric-work/project/shared-resources/data/barotrauma -type f | wc -l)" -eq 9

      - name: Run loader-independent core tests
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/europamine-core-test
          mkdir -p /tmp/europamine-core-test
          javac -encoding UTF-8 -source 17 -target 17 -d /tmp/europamine-core-test \
            $(find .fabric-work/project/common/src/main/java -name '*.java' -print) \
            $(find .fabric-work/project/common/src/test/java -name '*.java' -print)
          java -cp /tmp/europamine-core-test com.z_mods.barotrauma.core.CoreBehaviorTest

      - name: Build Fabric 1.20.1 jar
        shell: bash
        working-directory: .fabric-work/project/fabric-1.20.1
        run: gradle --no-daemon clean build --stacktrace

      - name: Smoke-test dedicated Fabric server
        shell: bash
        working-directory: .fabric-work/project/fabric-1.20.1
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle --no-daemon runServer --args='nogui' > /tmp/europamine-server.log 2>&1
          STATUS=$?
          set -e
          tail -n 250 /tmp/europamine-server.log
          if grep -q 'Done (' /tmp/europamine-server.log; then
            echo "SERVER_SMOKE_TEST_PASSED (timeout/status=$STATUS)"
            exit 0
          fi
          echo "SERVER_SMOKE_TEST_FAILED (status=$STATUS)"
          exit 1

      - name: Validate jar metadata and supplied resources
        shell: bash
        run: |
          set -euxo pipefail
          JAR=$(find .fabric-work/project/fabric-1.20.1/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)
          test -n "$JAR"
          unzip -l "$JAR" | grep -q 'fabric.mod.json'
          unzip -l "$JAR" | grep -q 'assets/barotrauma/'
          unzip -l "$JAR" | grep -q 'data/barotrauma/'
          unzip -p "$JAR" fabric.mod.json | grep -q '"id": "barotrauma"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"version": "0.3.0-fabric.1"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"fabricloader": ">=0.16.10"'
          test "$(zipinfo -1 "$JAR" | grep '^assets/barotrauma/' | grep -v '/$' | wc -l)" -eq 109
          test "$(zipinfo -1 "$JAR" | grep '^data/barotrauma/' | grep -v '/$' | wc -l)" -eq 9
          cp "$JAR" EuropaMine-0.3.0-Fabric-1.20.1.jar
          rm -rf .fabric-work/project/fabric-1.20.1/run
          tar --exclude='fabric-1.20.1/build' --exclude='fabric-1.20.1/.gradle' -czf EuropaMine-0.3.0-Fabric-1.20.1-Sources.tar.gz -C .fabric-work/project common fabric-1.20.1 shared-resources
          sha256sum EuropaMine-0.3.0-Fabric-1.20.1.jar EuropaMine-0.3.0-Fabric-1.20.1-Sources.tar.gz
          ls -lh EuropaMine-0.3.0-Fabric-1.20.1.jar EuropaMine-0.3.0-Fabric-1.20.1-Sources.tar.gz

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: EuropaMine-Fabric-1.20.1
          if-no-files-found: error
          retention-days: 7
          path: |
            EuropaMine-0.3.0-Fabric-1.20.1.jar
            EuropaMine-0.3.0-Fabric-1.20.1-Sources.tar.gz
