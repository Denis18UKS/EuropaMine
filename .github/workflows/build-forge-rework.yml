name: Build EuropaMine Forge requested rework

on:
  push:
    branches:
      - forge-ui-submarine-rework-20261102

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested rework patches
        shell: bash
        run: |
          set -euxo pipefail
          cat ci/round2-chunks/part-* > /tmp/round2-full.b64
          sha256sum -c ci/round2-chunks/EXPECTED.sha256
          base64 -d /tmp/round2-full.b64 | gzip -d > /tmp/europamine-round2.patch
          git apply --check /tmp/europamine-round2.patch
          git apply /tmp/europamine-round2.patch
          git apply --check ci/fixes/recipe-book-1.patch
          git apply ci/fixes/recipe-book-1.patch
          git apply --check ci/fixes/compile-2.patch
          git apply ci/fixes/compile-2.patch
          git apply --check ci/fixes/feature-gap-submarine-selector.patch
          git apply ci/fixes/feature-gap-submarine-selector.patch
          git apply --check ci/fixes/inventory-adaptive.patch
          git apply ci/fixes/inventory-adaptive.patch

          cat ci/v041-chunks/part-* > /tmp/v041-full.b64
          echo 'ba91bc9e7d9276223453841e7882eecbffb2ed7ccafe42b7b4adb4e6aa5175da  /tmp/v041-full.b64' | sha256sum -c -
          base64 -d /tmp/v041-full.b64 | gzip -d > /tmp/europamine-v041.patch
          echo 'aa9b82faeeec23d735b5adf574457017252fc15bdb0ba34c8d12ee5d911a680c  /tmp/europamine-v041.patch' | sha256sum -c -
          git apply --check /tmp/europamine-v041.patch
          git apply /tmp/europamine-v041.patch

          cat ci/v042-chunks/part-* > /tmp/v042-full.b64
          echo 'ff97c6dfac1d5698f12b4f89e69557dd3db4c338cf96ef3f1c1a27303cb0d943  /tmp/v042-full.b64' | sha256sum -c -
          base64 -d /tmp/v042-full.b64 | gzip -d > /tmp/europamine-v042.patch
          echo '2d72e791610458f8a377d3a92fe04f122b274b174a1641d0401385890bed0dd8  /tmp/europamine-v042.patch' | sha256sum -c -
          git apply --check /tmp/europamine-v042.patch
          git apply /tmp/europamine-v042.patch
          echo 'e4d840a9fccb1c8c85d0cc5eed063c6192ea22e279271ee084e1672109b9f2e0  ci/v042-newfiles.b64' | sha256sum -c -
          base64 -d ci/v042-newfiles.b64 | gzip -d > /tmp/europamine-v042-newfiles.patch
          echo 'b8850602731262f155dc73b4c6291d78e5cc8b8ac5e15644b824d9acd36200b3  /tmp/europamine-v042-newfiles.patch' | sha256sum -c -
          git apply --check /tmp/europamine-v042-newfiles.patch
          git apply /tmp/europamine-v042-newfiles.patch

          cat ci/v043-chunks/part-* > /tmp/v043-full.b64
          echo '11273293fd299dabd5a2c9f229eb6515d25812ee65a09b63beaefe02d2535908  /tmp/v043-full.b64' | sha256sum -c -
          base64 -d /tmp/v043-full.b64 | gzip -d > /tmp/europamine-v043.patch
          echo 'c5cb649513848c31f167d86a7e2cb8b29c4503af42d68e48ec53c411de385e1a  /tmp/europamine-v043.patch' | sha256sum -c -
          git apply --check /tmp/europamine-v043.patch
          git apply /tmp/europamine-v043.patch
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify preserved and requested sources
        shell: bash
        run: |
          set -euxo pipefail
          test -f src/main/java/com/z_mods/barotrauma/client/SubmarineCollisionResolver.java
          test -f src/main/java/com/z_mods/barotrauma/client/ExtraHotbarClientEvents.java
          test -f src/main/java/com/z_mods/barotrauma/client/NavigationTerminalScreen.java
          test -f src/main/java/com/z_mods/barotrauma/client/PowerScreens.java
          test -f src/main/java/com/z_mods/barotrauma/client/ElectricalPanelRealScreen.java
          test -f src/main/java/com/z_mods/barotrauma/blocks/CabinetBlock.java
          test -f src/main/java/com/z_mods/barotrauma/item/ChargedSupplyItem.java
          test -f src/main/java/com/z_mods/barotrauma/submarines/SubmarineZoneData.java
          test -f src/main/java/com/z_mods/barotrauma/power/ReactorExplosionGuard.java
          test -f src/main/java/com/z_mods/barotrauma/client/RoundPresentationClient.java
          test -f src/main/java/com/z_mods/barotrauma/client/HudOverlayEvents.java
          test -f src/main/java/com/z_mods/barotrauma/client/PowerWorldVisualRenderer.java
          test -f src/main/java/com/z_mods/barotrauma/logic/ReactorSafetyLogic.java
          test -f src/main/java/com/z_mods/barotrauma/logic/SubmarineCommandLogic.java
          test -f src/main/resources/assets/barotrauma/shaders/core/world_fx.json
          test -f src/main/java/com/z_mods/barotrauma/client/MovableHotbarRenderer.java
          test -f src/main/java/com/z_mods/barotrauma/mixin/impl/GuiHotbarMixin.java
          test -f src/main/java/com/z_mods/barotrauma/power/BlockIntegrityData.java
          test -f src/main/java/com/z_mods/barotrauma/logic/BlockIntegrityLogic.java
          test -f src/main/java/com/z_mods/barotrauma/logic/HudModeLogic.java
          test -f src/main/java/com/z_mods/barotrauma/blocks/CutPlaceholderBlock.java
          test -f src/main/resources/assets/barotrauma/blockstates/cut_placeholder.json
          test -f src/main/resources/assets/barotrauma/models/block/cut_placeholder.json
          test -f src/main/resources/assets/barotrauma/shaders/core/tool_fx.json
          test -f src/main/java/com/z_mods/barotrauma/client/CreativeWireRemovalClient.java
          test -f src/main/java/com/z_mods/barotrauma/logic/WireRemovalLogic.java

      - name: Run pure behavior tests
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/europamine-logic-test
          mkdir -p /tmp/europamine-logic-test
          javac -d /tmp/europamine-logic-test \
            src/main/java/com/z_mods/barotrauma/logic/HudLayoutMath.java \
            src/main/java/com/z_mods/barotrauma/logic/ReactorSafetyLogic.java \
            src/main/java/com/z_mods/barotrauma/logic/ToolSafetyLogic.java \
            src/main/java/com/z_mods/barotrauma/logic/SubmarineCommandLogic.java \
            src/main/java/com/z_mods/barotrauma/logic/BlockIntegrityLogic.java \
            src/main/java/com/z_mods/barotrauma/logic/HudModeLogic.java \
            src/main/java/com/z_mods/barotrauma/logic/WireRemovalLogic.java \
            scripts/logic-tests/LogicBehaviorTest.java
          java -cp /tmp/europamine-logic-test LogicBehaviorTest

      - name: Build Forge 1.20.1
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Validate built jar
        shell: bash
        run: |
          set -euxo pipefail
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)
          test -n "$JAR"
          unzip -l "$JAR" > /tmp/jar-list.txt
          grep -q 'META-INF/mods.toml' /tmp/jar-list.txt
          grep -q 'com/z_mods/barotrauma/client/SubmarineCollisionResolver.class' /tmp/jar-list.txt
          grep -q 'com/z_mods/barotrauma/client/ExtraHotbarClientEvents.class' /tmp/jar-list.txt
          grep -q 'com/z_mods/barotrauma/client/NavigationTerminalScreen.class' /tmp/jar-list.txt
          grep -q 'com/z_mods/barotrauma/client/MovableHotbarRenderer.class' /tmp/jar-list.txt
          grep -q 'com/z_mods/barotrauma/mixin/impl/GuiHotbarMixin.class' /tmp/jar-list.txt
          grep -q 'com/z_mods/barotrauma/power/BlockIntegrityData.class' /tmp/jar-list.txt
          grep -q 'com/z_mods/barotrauma/logic/BlockIntegrityLogic.class' /tmp/jar-list.txt
          grep -q 'com/z_mods/barotrauma/logic/HudModeLogic.class' /tmp/jar-list.txt
          grep -q 'assets/barotrauma/shaders/core/world_fx.json' /tmp/jar-list.txt
          grep -q 'com/z_mods/barotrauma/blocks/CutPlaceholderBlock.class' /tmp/jar-list.txt
          grep -q 'assets/barotrauma/blockstates/cut_placeholder.json' /tmp/jar-list.txt
          grep -q 'assets/barotrauma/models/block/cut_placeholder.json' /tmp/jar-list.txt
          grep -q 'assets/barotrauma/shaders/core/tool_fx.json' /tmp/jar-list.txt
          grep -q 'com/z_mods/barotrauma/client/CreativeWireRemovalClient.class' /tmp/jar-list.txt
          grep -q 'com/z_mods/barotrauma/logic/WireRemovalLogic.class' /tmp/jar-list.txt
          cp "$JAR" EuropaMine-0.4.3-Forge-1.20.1-Rework.jar
          sha256sum EuropaMine-0.4.3-Forge-1.20.1-Rework.jar

      - name: Smoke-test dedicated Forge server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\nonline-mode=false\n' > run/eula.txt
          printf 'online-mode=false\n' > run/server.properties
          set +e
          timeout 120s ./gradlew --no-daemon runServer --args='nogui' > /tmp/europamine-forge-server.log 2>&1
          STATUS=$?
          set -e
          tail -n 300 /tmp/europamine-forge-server.log
          if grep -q 'Done (' /tmp/europamine-forge-server.log; then
            echo "FORGE_SERVER_SMOKE_TEST_PASSED (status=$STATUS)"
          else
            echo "FORGE_SERVER_SMOKE_TEST_FAILED (status=$STATUS)"
            exit 1
          fi

      - name: Package sources
        shell: bash
        run: |
          set -euxo pipefail
          zip -qr EuropaMine-0.4.3-Forge-1.20.1-Rework-Sources.zip . \
            -x '.git/*' '.gradle/*' 'build/*' 'run/*' '.gui-assets/*' \
               'EuropaMine-0.4.3-Forge-1.20.1-Rework-Sources.zip' \
               'EuropaMine-0.4.3-Forge-1.20.1-Rework.jar' 'ci/*'
          sha256sum EuropaMine-0.4.3-Forge-1.20.1-Rework-Sources.zip
          ls -lh EuropaMine-0.4.3-Forge-1.20.1-Rework.jar EuropaMine-0.4.3-Forge-1.20.1-Rework-Sources.zip

      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: EuropaMine-Forge-1.20.1-Rework-v0.4.3
          if-no-files-found: error
          retention-days: 7
          path: |
            EuropaMine-0.4.3-Forge-1.20.1-Rework.jar
            EuropaMine-0.4.3-Forge-1.20.1-Rework-Sources.zip
