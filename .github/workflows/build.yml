name: Сборка Forge 1.20.1

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Развернуть навигационный терминал
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .navigation-assets/navigation-overlay.part000
            cat .navigation-assets/navigation-overlay.part001
            cat .navigation-assets/navigation-overlay-fix002.part*
            cat .navigation-assets/navigation-overlay.part003
            cat .navigation-assets/navigation-overlay.part004
            cat .navigation-assets/navigation-overlay.part005
            cat .navigation-assets/navigation-overlay.part006
            cat .navigation-assets/navigation-overlay.part007
            cat .navigation-assets/navigation-overlay.part008
            cat .navigation-assets/navigation-overlay.part009
            cat .navigation-assets/navigation-overlay.part010
            cat .navigation-assets/navigation-overlay.part011
          } | tr -d '\r\n' | base64 --decode > /tmp/navigation-terminal-overlay.zip
          unzip -oq /tmp/navigation-terminal-overlay.zip -d .
          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = [
              Path('src/main/java/com/z_mods/barotrauma/client/NavigationTerminalScreen.java'),
              Path('src/main/java/com/z_mods/barotrauma/navigation/NavigationWorldData.java'),
              Path('src/main/java/com/z_mods/barotrauma/navigation/NavigationSystem.java'),
              Path('src/main/java/com/z_mods/barotrauma/network/NavigationPackets.java'),
              Path('src/main/resources/assets/barotrauma/textures/gui/navigation_terminal_frame.png'),
          ]
          for path in expected:
              if not path.is_file():
                  raise SystemExit(f'Не развернут обязательный файл: {path}')
              print(f'{path}: {path.stat().st_size} bytes')

          texture = expected[-1]
          data = texture.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit(f'Повреждена текстура навигационного терминала: {texture}')
          print(f'navigation texture sha256={hashlib.sha256(data).hexdigest()}')
          PY

      - name: Ограничить масштаб существующих GUI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/z_mods/barotrauma/client/PowerScreens.java')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'return Math.min(width / (float) W, height / (float) H);':
                  'return Math.min(1.0F, Math.min(width / (float) W, height / (float) H));',
              'return Math.min(width / (float) panelWidth(), height / (float) panelHeight());':
                  'return Math.min(1.0F, Math.min(width / (float) panelWidth(), height / (float) panelHeight()));',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Не найдена ожидаемая строка масштаба: {old}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Разрешить запуск Gradle
        run: chmod +x gradlew

      - name: Собрать мод
        run: ./gradlew build --stacktrace

      - name: Упаковать исходники
        shell: bash
        run: |
          zip -qr EuropaMine-0.3.0-Forge-1.20.1-sources.zip . \
            -x '.git/*' '.gradle/*' 'build/*' '.gui-assets/*' '.navigation-assets/*' \
               'EuropaMine-0.3.0-Forge-1.20.1-sources.zip'

      - name: Сохранить JAR
        uses: actions/upload-artifact@v4
        with:
          name: EuropaMine-Forge-1.20.1-JAR
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Сохранить исходники
        uses: actions/upload-artifact@v4
        with:
          name: EuropaMine-Forge-1.20.1-Sources
          path: EuropaMine-0.3.0-Forge-1.20.1-sources.zip
          if-no-files-found: error
