name: Сборка Forge 1.20.1

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Развернуть точные GUI-ресурсы
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/java/com/z_mods/barotrauma/client
          mkdir -p src/main/resources/assets/barotrauma/textures/gui
          cat .gui-assets/PowerScreens.part* | base64 --decode > src/main/java/com/z_mods/barotrauma/client/PowerScreens.java
          cat .gui-assets/reactor.part* | base64 --decode > src/main/resources/assets/barotrauma/textures/gui/reactor_exact.png
          cat .gui-assets/tech.part* | base64 --decode > src/main/resources/assets/barotrauma/textures/gui/electrical_technical_exact.png
          cat .gui-assets/maint.part* | base64 --decode > src/main/resources/assets/barotrauma/textures/gui/electrical_maintenance_exact.png

      - name: Разрешить запуск Gradle
        run: chmod +x gradlew

      - name: Собрать мод
        run: ./gradlew build --stacktrace

      - name: Упаковать исходники
        shell: bash
        run: |
          zip -qr EuropaMine-0.3.0-Forge-1.20.1-sources.zip . \
            -x '.git/*' '.gradle/*' 'build/*' '.gui-assets/*' 'EuropaMine-0.3.0-Forge-1.20.1-sources.zip'

      - name: Сохранить JAR
        uses: actions/upload-artifact@v4
        with:
          name: EuropaMine-Forge-1.20.1-JAR
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Сохранить исходники
        uses: actions/upload-artifact@v4
        with:
          name: EuropaMine-Forge-1.20.1-Sources
          path: EuropaMine-0.3.0-Forge-1.20.1-sources.zip
          if-no-files-found: error
