name: Сборка Forge 1.20.1

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Развернуть исправленный GUI-код и точные текстуры
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/java/com/z_mods/barotrauma/client
          mkdir -p src/main/resources/assets/barotrauma/textures/gui

          cat .gui-assets/PowerScreens.part* | tr -d '\r\n' | base64 --decode > src/main/java/com/z_mods/barotrauma/client/PowerScreens.java

          python - <<'PY'
          from pathlib import Path

          path = Path("src/main/java/com/z_mods/barotrauma/client/PowerScreens.java")
          text = path.read_text(encoding="utf-8")

          reactor_old = "return Math.min(width / (float) W, height / (float) H);"
          reactor_new = "return Math.min(1.0F, Math.min(width / (float) W, height / (float) H));"
          panel_old = "return Math.min(width / (float) panelWidth(), height / (float) panelHeight());"
          panel_new = "return Math.min(1.0F, Math.min(width / (float) panelWidth(), height / (float) panelHeight()));"

          if reactor_old not in text:
              raise SystemExit("Не найдена функция масштаба интерфейса реактора")
          if panel_old not in text:
              raise SystemExit("Не найдена функция масштаба интерфейса электрощитка")

          text = text.replace(reactor_old, reactor_new, 1)
          text = text.replace(panel_old, panel_new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          {
            cat .gui-assets/reactor_exact.part00
            cat .gui-assets/reactor4k.part04
            cat .gui-assets/reactor4k.part05
            cat .gui-assets/reactor4k.part06
            cat .gui-assets/reactor4k.part07
            cat .gui-assets/reactor4k.part08
            cat .gui-assets/reactor4k.part09
            cat .gui-assets/reactor4k.part10
            cat .gui-assets/reactor4k.part11
            cat .gui-assets/reactor_exact.part03
          } | tr -d '\r\n' | base64 --decode > src/main/resources/assets/barotrauma/textures/gui/reactor_exact.png

          tr -d '\r\n' < .gui-assets/technical_exact.b64 | base64 --decode > src/main/resources/assets/barotrauma/textures/gui/electrical_technical_exact.png
          tr -d '\r\n' < .gui-assets/maintenance_exact.b64 | base64 --decode > src/main/resources/assets/barotrauma/textures/gui/electrical_maintenance_exact.png

          python - <<'PY'
          from pathlib import Path
          import hashlib

          reactor = Path("src/main/resources/assets/barotrauma/textures/gui/reactor_exact.png")
          data = reactor.read_bytes()
          expected = "b5af574a60e21f31605664e35ab392dfd813cae8e313474020b511c9faa19f23"
          actual = hashlib.sha256(data).hexdigest()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Файл реактора не является PNG")
          if actual != expected:
              raise SystemExit(f"Неверная текстура реактора: {actual}")
          print(f"reactor_exact.png: {len(data)} bytes, sha256={actual}")
          PY

          file src/main/resources/assets/barotrauma/textures/gui/reactor_exact.png
          file src/main/resources/assets/barotrauma/textures/gui/electrical_technical_exact.png
          file src/main/resources/assets/barotrauma/textures/gui/electrical_maintenance_exact.png

      - name: Разрешить запуск Gradle
        run: chmod +x gradlew

      - name: Собрать мод
        run: ./gradlew build --stacktrace

      - name: Упаковать исходники
        shell: bash
        run: |
          zip -qr EuropaMine-0.3.0-Forge-1.20.1-sources.zip . \
            -x '.git/*' '.gradle/*' 'build/*' '.gui-assets/*' 'EuropaMine-0.3.0-Forge-1.20.1-sources.zip'

      - name: Сохранить JAR
        uses: actions/upload-artifact@v4
        with:
          name: EuropaMine-Forge-1.20.1-JAR
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Сохранить исходники
        uses: actions/upload-artifact@v4
        with:
          name: EuropaMine-Forge-1.20.1-Sources
          path: EuropaMine-0.3.0-Forge-1.20.1-sources.zip
          if-no-files-found: error
