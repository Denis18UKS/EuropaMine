name: Сборка Forge 1.20.1

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Исправить масштаб GUI без изменения механики
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          source = Path("src/main/java/com/z_mods/barotrauma/client/PowerScreens.java")
          text = source.read_text(encoding="utf-8")

          replacements = (
              (
                  "return Math.min(width / (float) W, height / (float) H);",
                  "return Math.min(1.0F, Math.min(width / (float) W, height / (float) H));",
              ),
              (
                  "return Math.min(width / (float) panelWidth(), height / (float) panelHeight());",
                  "return Math.min(1.0F, Math.min(width / (float) panelWidth(), height / (float) panelHeight()));",
              ),
          )

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"Не найдена ожидаемая строка масштаба: {old}")

          source.write_text(text, encoding="utf-8")

          textures = (
              Path("src/main/resources/assets/barotrauma/textures/gui/reactor_exact.png"),
              Path("src/main/resources/assets/barotrauma/textures/gui/electrical_technical_exact.png"),
              Path("src/main/resources/assets/barotrauma/textures/gui/electrical_maintenance_exact.png"),
          )
          for texture in textures:
              data = texture.read_bytes()
              if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit(f"Повреждён GUI-ресурс: {texture}")
              print(f"{texture}: {len(data)} bytes, sha256={hashlib.sha256(data).hexdigest()}")
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path("src/main/java/com/z_mods/barotrauma/client/PowerScreens.java")
          text = path.read_text(encoding="utf-8")

          patches = {
              "return Math.min(width / (float) W, height / (float) H);":
                  "return Math.min(1.0F, Math.min(width / (float) W, height / (float) H));",
              "return Math.min(width / (float) panelWidth(), height / (float) panelHeight());":
                  "return Math.min(1.0F, Math.min(width / (float) panelWidth(), height / (float) panelHeight()));",
          }

          for old, new in patches.items():
              if old not in text:
                  raise SystemExit(f"Не найдена ожидаемая строка GUI: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Разрешить запуск Gradle
        run: chmod +x gradlew

      - name: Собрать мод
        run: ./gradlew build --stacktrace

      - name: Упаковать исходники
        shell: bash
        run: |
          zip -qr EuropaMine-0.3.0-Forge-1.20.1-sources.zip . \
            -x '.git/*' '.gradle/*' 'build/*' '.gui-assets/*' 'EuropaMine-0.3.0-Forge-1.20.1-sources.zip'

      - name: Сохранить JAR
        uses: actions/upload-artifact@v4
        with:
          name: EuropaMine-Forge-1.20.1-JAR
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Сохранить исходники
        uses: actions/upload-artifact@v4
        with:
          name: EuropaMine-Forge-1.20.1-Sources
          path: EuropaMine-0.3.0-Forge-1.20.1-sources.zip
          if-no-files-found: error
