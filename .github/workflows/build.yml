name: Сборка Forge 1.20.1

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Разрешить запуск Gradle
        run: chmod +x gradlew

      - name: Собрать мод
        run: ./gradlew build --stacktrace

      - name: Упаковать исходники
        run: git archive --format=zip --output=EuropaMine-0.3.0-Forge-1.20.1-sources.zip HEAD

      - name: Сохранить JAR
        uses: actions/upload-artifact@v4
        with:
          name: EuropaMine-Forge-1.20.1-JAR
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Сохранить исходники
        uses: actions/upload-artifact@v4
        with:
          name: EuropaMine-Forge-1.20.1-Sources
          path: EuropaMine-0.3.0-Forge-1.20.1-sources.zip
          if-no-files-found: error
