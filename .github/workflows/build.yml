name: Материализация исходников навигационного терминала

on:
  push:
    branches:
      - codex/navigation-source-files-fix
  workflow_dispatch:

jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Получить ветку
        uses: actions/checkout@v4
        with:
          ref: codex/navigation-source-files-fix
          fetch-depth: 0

      - name: Добавить реальные исходники и удалить временную упаковку
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .navigation-assets/navigation-overlay.part000
            cat .navigation-assets/navigation-overlay.part001
            cat .navigation-assets/navigation-overlay-fix002.part*
            cat .navigation-assets/navigation-overlay.part003
            cat .navigation-assets/navigation-overlay.part004
            cat .navigation-assets/navigation-overlay.part005
            cat .navigation-assets/navigation-overlay.part006
            cat .navigation-assets/navigation-overlay.part007
            cat .navigation-assets/navigation-overlay.part008
            cat .navigation-assets/navigation-overlay.part009
            cat .navigation-assets/navigation-overlay.part010
            cat .navigation-assets/navigation-overlay.part011
          } | tr -d '\r\n' | base64 --decode > /tmp/navigation-terminal-overlay.zip

          unzip -oq /tmp/navigation-terminal-overlay.zip -d . \
            -x 'src/main/java/com/z_mods/barotrauma/navigation/NavigationReferenceData.java' \
               'src/main/java/com/z_mods/barotrauma/power/PowerSystem.java'

          rm -rf .navigation-assets

          python - <<'PY'
          from pathlib import Path
          import base64

          clean_workflow = ''
          Path('.github/workflows/build.yml').write_bytes(base64.b64decode(clean_workflow))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Добавить реальные исходники навигационного терминала'
          git push origin HEAD:codex/navigation-source-files-fix
