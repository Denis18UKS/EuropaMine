name: Материализация Aeronautics-motion

on:
  push:
    branches:
      - codex/profession-hotbar-status-blueprint
    paths:
      - '.aero-motion/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Применить адаптацию движения
        shell: bash
        run: |
          set -euo pipefail
          cat .aero-motion/part-* > /tmp/aero.patch.xz.b64
          echo 'eac95d64cbd193e886ae14d6525117184f495f80ef66d977ac01d7317bb2a12a  /tmp/aero.patch.xz.b64' | sha256sum -c -
          base64 -d /tmp/aero.patch.xz.b64 | xz -d > /tmp/aero.patch
          echo '0d399863e8aa017fa7fdbe87ffbe5435842593a50305be989d6d3867a31f0eef  /tmp/aero.patch' | sha256sum -c -
          git apply --check /tmp/aero.patch
          git apply /tmp/aero.patch
          rm -rf .aero-motion
      - name: Зафиксировать исходники
        shell: bash
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'Адаптировать физику Aeronautics/Create для плавного движения'
          git push origin HEAD:codex/profession-hotbar-status-blueprint
